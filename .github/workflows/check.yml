name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mcp
      - name: lint, unit tests, generated files, MCP smoke test
        run: npm run check
      - name: sync selects every source (dry run, no network)
        run: node scripts/sync.mjs --dry-run
